<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sparhamster">
<meta name="theme-color" id="themeColorMeta" content="#f6f4ef">
<title>Sparhamster</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#5fae8c; --accent-dark:#3f8c6c; --accent-soft:#dff0e6;
  --bg:#f6f4ef; --card:#ffffff; --card-2:#fbfaf7;
  --text:#2b2b26; --text-soft:#7a7669; --text-faint:#a7a294;
  --border:#eae6db; --danger:#d97a6c; --danger-soft:#fbe6e2;
  --income:#5fae8c; --income-soft:#dff0e6;
  --shadow:0 8px 24px rgba(60,50,30,0.08);
  --radius:20px; --radius-sm:12px;
  --nav-h:74px;
}
[data-theme="lavendel"]{ --accent:#8b7ec8; --accent-dark:#6d5fae; --accent-soft:#eae6f8; --bg:#f6f4fa; }
[data-theme="pfirsich"]{ --accent:#e08e5b; --accent-dark:#c56f3c; --accent-soft:#fbe8d9; --bg:#faf4ee; }
[data-theme="blau"]{ --accent:#4f8fc0; --accent-dark:#3a71a0; --accent-soft:#dcecf6; --bg:#f2f6f9; }
[data-theme="gold"]{ --accent:#c8a13a; --accent-dark:#a4831f; --accent-soft:#f6edd4; --bg:#faf7ef; }
[data-theme="rosa"]{ --accent:#dd8fa4; --accent-dark:#c06a82; --accent-soft:#fbe4ea; --bg:#fbf4f6; }

[data-mode="dark"]{
  --bg:#1c1b18; --card:#26251f; --card-2:#2c2b24;
  --text:#f1efe8; --text-soft:#b8b3a4; --text-faint:#847f6f;
  --border:#37352c; --danger:#e08d7f; --danger-soft:#3a2622;
  --shadow:0 8px 24px rgba(0,0,0,0.35);
}
[data-theme="mint"][data-mode="dark"]{ --accent:#6fc39d; --accent-dark:#8fd6b6; --accent-soft:#20352c; --income:#6fc39d; --income-soft:#20352c; }
[data-theme="lavendel"][data-mode="dark"]{ --accent:#a596df; --accent-dark:#bcb0ea; --accent-soft:#2c2740; --bg:#1c1b20; }
[data-theme="pfirsich"][data-mode="dark"]{ --accent:#eba26c; --accent-dark:#f0b686; --accent-soft:#3a2a1c; --bg:#1e1b18; }
[data-theme="blau"][data-mode="dark"]{ --accent:#78b0dc; --accent-dark:#96c3e5; --accent-soft:#1e2f3c; --bg:#191c1e; }
[data-theme="gold"][data-mode="dark"]{ --accent:#dcb95c; --accent-dark:#e8cb84; --accent-soft:#352c17; --bg:#1c1a15; }
[data-theme="rosa"][data-mode="dark"]{ --accent:#ef9fb3; --accent-dark:#f4b7c6; --accent-soft:#3a232a; --bg:#201a1c; }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; touch-action:manipulation;}
html,body{margin:0;padding:0;}
html{ -webkit-text-size-adjust:100%; touch-action:manipulation; }
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; min-height:100dvh;
  padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  transition:background .3s ease,color .3s ease;
  overscroll-behavior-y:none;
}
h1,h2,h3{margin:0; font-weight:700;}
button{font-family:inherit; touch-action:manipulation;}
.app{max-width:520px; margin:0 auto; padding:0 16px;}

/* Header */
.topbar{
  position:sticky; top:0; z-index:20; backdrop-filter:blur(16px);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  padding:calc(14px + env(safe-area-inset-top)) 16px 10px; border-bottom:1px solid var(--border);
}
.topbar-inner{max-width:520px; margin:0 auto; display:flex; align-items:center; justify-content:space-between;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-name{font-size:19px; font-weight:800; letter-spacing:-0.02em;}
.brand-icon{width:34px;height:34px;}
.net-pill{
  font-size:13px; font-weight:700; padding:7px 12px; border-radius:999px;
  background:var(--accent-soft); color:var(--accent-dark); cursor:pointer; border:none; font-family:inherit;
}

/* Cards */
.card{
  background:var(--card); border-radius:var(--radius); padding:18px;
  box-shadow:var(--shadow); margin-bottom:14px; border:1px solid var(--border);
}
.card h2{font-size:15px; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.section-title{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:700; margin:22px 4px 10px;}

/* Companion */
.companion-card{display:flex; align-items:center; gap:16px; padding:18px;}
.companion-svg{width:76px; height:76px; flex-shrink:0;}
.companion-info{flex:1; min-width:0;}
.companion-name{font-weight:800; font-size:16px;}
.companion-mood{font-size:13px; color:var(--text-soft); margin-top:2px;}
.streak-badge{
  display:inline-flex; align-items:center; gap:4px; margin-top:8px;
  font-size:12px; font-weight:700; color:var(--accent-dark);
  background:var(--accent-soft); padding:4px 10px; border-radius:999px;
}

/* Big stat */
.stat-row{display:flex; gap:10px;}
.stat-box{flex:1; background:var(--card-2); border-radius:var(--radius-sm); padding:12px 14px; text-align:center;}
.stat-box .val{font-size:19px; font-weight:800;}
.stat-box.income .val{color:var(--income);}
.stat-box.expense .val{color:var(--danger);}
.stat-box .lbl{font-size:11.5px; color:var(--text-faint); margin-top:2px; font-weight:600;}

/* Form */
.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-soft); margin-bottom:5px;}
input,select,textarea{
  width:100%; padding:11px 12px; border-radius:12px; border:1.5px solid var(--border);
  background:var(--card-2); color:var(--text); font-size:16px; font-family:inherit;
} /* 16px prevents iOS Safari from auto-zooming the page on focus */
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent);}
.type-toggle{display:flex; gap:8px; margin-bottom:14px;}
.type-toggle button{
  flex:1; padding:11px; border-radius:12px; border:1.5px solid var(--border); background:var(--card-2);
  color:var(--text-soft); font-weight:700; font-size:14px; cursor:pointer;
}
.type-toggle button.active.expense{background:var(--danger-soft); border-color:var(--danger); color:var(--danger);}
.type-toggle button.active.income{background:var(--income-soft); border-color:var(--income); color:var(--income-dark,var(--accent-dark));}
.cat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;}
.cat-chip{
  display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px;
  border-radius:12px; border:1.5px solid var(--border); background:var(--card-2); cursor:pointer;
  font-size:10.5px; color:var(--text-soft); font-weight:600; text-align:center; line-height:1.2;
}
.cat-chip .em{font-size:20px;}
.cat-chip.active{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-dark);}
.btn-primary{
  width:100%; padding:14px; border-radius:14px; border:none; background:var(--accent);
  color:#fff; font-weight:700; font-size:15.5px; cursor:pointer; box-shadow:0 6px 16px color-mix(in srgb, var(--accent) 40%, transparent);
}
.btn-secondary{
  width:100%; padding:12px; border-radius:14px; border:1.5px solid var(--border); background:transparent;
  color:var(--text-soft); font-weight:600; font-size:14px; cursor:pointer; margin-top:8px;
}
.btn-danger-text{background:none;border:none;color:var(--danger);font-weight:600;font-size:13px;cursor:pointer;padding:6px;}

/* Transaction list */
.tx-item{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border);}
.tx-item:last-child{border-bottom:none;}
.tx-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--card-2);}
.tx-main{flex:1; min-width:0;}
.tx-cat{font-weight:700; font-size:14px;}
.tx-note{font-size:12.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tx-amount{font-weight:800; font-size:14.5px; flex-shrink:0;}
.tx-amount.expense{color:var(--danger);}
.tx-amount.income{color:var(--income);}
.empty-state{text-align:center; padding:28px 10px; color:var(--text-faint);}
.empty-state .badge{width:48px;height:48px;border-radius:50%;background:var(--card-2);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 10px;}
.empty-state p{font-size:13.5px; margin:0;}

/* Calendar */
.cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.cal-nav{background:var(--card-2); border:none; width:32px;height:32px;border-radius:10px; font-size:16px; cursor:pointer; color:var(--text);}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
.cal-dow{text-align:center; font-size:10.5px; color:var(--text-faint); font-weight:700; padding-bottom:4px;}
.cal-day{
  aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; background:var(--card-2); cursor:pointer; position:relative; color:var(--text);
  border:1.5px solid transparent;
}
.cal-day.empty{background:none; cursor:default;}
.cal-day.today{border-color:var(--accent);}
.cal-day .dot{width:5px;height:5px;border-radius:50%; margin-top:2px;}
.cal-day.pos .dot{background:var(--income);}
.cal-day.neg .dot{background:var(--danger);}
.cal-day.future{opacity:.45; cursor:default;}

/* Budget bars */
.budget-row{margin-bottom:16px;}
.budget-row-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; font-size:13.5px;}
.budget-row-top .cat{font-weight:700; display:flex; align-items:center; gap:6px;}
.budget-row-top .amt{color:var(--text-soft); font-weight:600; font-size:12.5px;}
.bar-track{height:9px; border-radius:99px; background:var(--card-2); overflow:hidden;}
.bar-fill{height:100%; border-radius:99px; background:var(--accent); transition:width .4s ease;}
.bar-fill.over{background:var(--danger);}
.bar-fill.warn{background:#dba63c;}

/* Accounts */
.acc-item{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);}
.acc-item:last-child{border-bottom:none;}
.acc-icon{width:38px;height:38px;border-radius:11px;background:var(--card-2);display:flex;align-items:center;justify-content:center;font-size:18px;}
.acc-main{flex:1;}
.acc-name{font-weight:700; font-size:14px;}
.acc-type{font-size:11.5px; color:var(--text-faint);}
.acc-balance{font-weight:800; font-size:14.5px;}

/* Chart */
.chart-wrap{overflow-x:auto;}
.simple-bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:12.5px;}
.simple-bar-row .lbl{width:96px; flex-shrink:0; color:var(--text-soft); font-weight:600; display:flex; gap:5px; align-items:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.simple-bar-row .track{flex:1; height:14px; background:var(--card-2); border-radius:7px; overflow:hidden;}
.simple-bar-row .fill{height:100%; border-radius:7px;}
.simple-bar-row .val{width:64px; text-align:right; font-weight:700; flex-shrink:0; font-size:12px;}

/* Nav */
.nav{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  background:color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter:blur(18px);
  border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom);
}
.nav-inner{max-width:520px; margin:0 auto; height:var(--nav-h); display:flex;}
.nav-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  background:none; border:none; color:var(--text-faint); font-size:10.5px; font-weight:700; cursor:pointer; gap:2px;
}
.nav-btn .ic{font-size:20px;}
.nav-btn.active{color:var(--accent);}

.modal-overlay{position:fixed; inset:0; background:rgba(20,18,12,0.45); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
.modal-sheet{background:var(--bg); width:100%; max-width:520px; border-radius:22px 22px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;}
.modal-handle{width:38px;height:4px;background:var(--border); border-radius:99px; margin:0 auto 14px;}
.modal-title{font-size:17px; font-weight:800; margin-bottom:14px;}
.toast{
  position:fixed; bottom:calc(var(--nav-h) + 14px); left:50%; transform:translateX(-50%);
  background:var(--text); color:var(--bg); padding:11px 18px; border-radius:99px; font-size:13.5px; font-weight:600;
  z-index:60; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
.row-between{display:flex; justify-content:space-between; align-items:center;}
.theme-swatches{display:flex; gap:10px; margin-bottom:16px;}
.swatch{width:38px;height:38px;border-radius:50%; cursor:pointer; border:2.5px solid transparent;}
.swatch.active{border-color:var(--text);}
.toggle-row{display:flex; gap:8px;}
.toggle-row button{flex:1; padding:9px; border-radius:11px; border:1.5px solid var(--border); background:var(--card-2); color:var(--text-soft); font-weight:600; font-size:13px;}
.toggle-row button.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.icon-btn{background:var(--card-2); border:none; width:34px;height:34px;border-radius:10px;font-size:15px;cursor:pointer;color:var(--text);}
small.hint{color:var(--text-faint); font-size:11.5px; display:block; margin-top:4px;}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-inner">
  <div class="brand"><span id="brandIcon" class="brand-icon"></span><span class="brand-name" id="brandName">Sparhamster</span></div>
  <div class="net-pill" id="netPill">–</div>
</div></div>

<div class="app" id="app"></div>

<div class="nav"><div class="nav-inner">
  <button class="nav-btn" data-tab="heute"><span class="ic">🏡</span>Heute</button>
  <button class="nav-btn" data-tab="kalender"><span class="ic">📅</span>Kalender</button>
  <button class="nav-btn" data-tab="budget"><span class="ic">🎯</span>Budget</button>
  <button class="nav-btn" data-tab="vermoegen"><span class="ic">💰</span>Vermögen</button>
  <button class="nav-btn" data-tab="trends"><span class="ic">📊</span>Trends</button>
  <button class="nav-btn" data-tab="einstellungen"><span class="ic">⚙️</span>Mehr</button>
</div></div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
